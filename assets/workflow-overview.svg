<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="2140" viewBox="0 0 1040 2140" role="img" aria-labelledby="title desc">
  <title id="title">Workflow Overview — OMSEP + Prism</title>
  <desc id="desc">Workflow from decision to recommendations. OMSEP plans the study. Research evidence feeds Prism. Human approval is required before recommendations, and Prism can loop back for revision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#101B31"/>
    </linearGradient>
    <linearGradient id="omsepPill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="prismPill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#CBD5E1"/>
    </marker>
  </defs>

  <rect width="1040" height="2140" rx="28" fill="url(#bg)"/>
  <rect x="52" y="42" width="936" height="2056" rx="28" fill="#FFFFFF" opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.12"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="520" y="98" text-anchor="middle" fill="#FFFFFF" font-size="34" font-weight="800">Workflow Overview</text>
    <text x="520" y="129" text-anchor="middle" fill="#CBD5E1" font-size="18">Plan the study with OMSEP, then turn evidence into action with Prism.</text>

    <rect x="350" y="162" width="340" height="42" rx="21" fill="url(#omsepPill)"/>
    <text x="520" y="189" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800">OMSEP · Plan the Study</text>

    <g fill="#182337" stroke="#31405B" stroke-width="1.5">
      <rect x="210" y="250" width="620" height="70" rx="18"/>
      <rect x="210" y="362" width="620" height="70" rx="18"/>
      <rect x="210" y="474" width="620" height="70" rx="18"/>
      <rect x="210" y="586" width="620" height="70" rx="18"/>
      <rect x="210" y="698" width="620" height="70" rx="18"/>
      <rect x="300" y="842" width="440" height="78" rx="18" fill="#132640"/>
    </g>

    <g stroke="#CBD5E1" stroke-width="2.3" fill="none" marker-end="url(#arrow)" opacity="0.9">
      <path d="M520 206 V240"/>
      <path d="M520 320 V352"/>
      <path d="M520 432 V464"/>
      <path d="M520 544 V576"/>
      <path d="M520 656 V688"/>
      <path d="M520 768 V832"/>
      <path d="M520 920 V968"/>
    </g>

    <g font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">
      <circle cx="258" cy="285" r="17" fill="#8B5CF6"/><text x="258" y="291">1</text>
      <circle cx="258" cy="397" r="17" fill="#7C3AED"/><text x="258" y="403">2</text>
      <circle cx="258" cy="509" r="17" fill="#6366F1"/><text x="258" y="515">3</text>
      <circle cx="258" cy="621" r="17" fill="#0EA5E9"/><text x="258" y="627">4</text>
      <circle cx="258" cy="733" r="17" fill="#14B8A6"/><text x="258" y="739">5</text>
    </g>

    <g fill="#E2E8F0" font-size="22" font-weight="700">
      <text x="296" y="292">Objective</text>
      <text x="296" y="404">Methodology</text>
      <text x="296" y="516">Scope</text>
      <text x="296" y="628">Essentials</text>
      <text x="296" y="740">Protocol</text>
      <text x="520" y="890" text-anchor="middle" font-size="24">Research Evidence</text>
    </g>

    <line x1="160" y1="1010" x2="880" y2="1010" stroke="#64748B" stroke-width="2" opacity="0.75"/>

    <rect x="292" y="1040" width="456" height="42" rx="21" fill="url(#prismPill)"/>
    <text x="520" y="1067" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800">PRISM · Turn Evidence Into Action</text>

    <g fill="#182337" stroke="#31405B" stroke-width="1.5">
      <rect x="250" y="1148" width="540" height="78" rx="18"/>
      <rect x="250" y="1302" width="540" height="78" rx="18"/>
      <rect x="170" y="1456" width="700" height="100" rx="20"/>
      <rect x="210" y="1616" width="620" height="78" rx="18"/>
      <polygon points="520,1754 650,1860 520,1966 390,1860"/>
      <rect x="250" y="2008" width="540" height="82" rx="18"/>
    </g>

    <g stroke="#CBD5E1" stroke-width="2.3" fill="none" marker-end="url(#arrow)" opacity="0.9">
      <path d="M520 1082 V1140"/>
      <path d="M520 1226 V1294"/>
      <path d="M520 1380 V1448"/>
      <path d="M520 1556 V1608"/>
      <path d="M520 1694 V1746"/>
      <path d="M520 1996 V2000"/>
    </g>

    <g fill="#E2E8F0" font-size="22" font-weight="700" text-anchor="middle">
      <text x="520" y="1196">1 · Organise</text>
      <text x="520" y="1350">2 · Consolidate</text>
      <text x="520" y="1504">3 · Findings + Candidate</text>
      <text x="520" y="1535">Insights</text>
      <text x="520" y="1665">4 · Provisional Severity</text>
      <text x="520" y="1868">5 · Human Approval</text>
      <text x="520" y="2059">6 · Recommendations</text>
    </g>

    <text x="520" y="1984" text-anchor="middle" fill="#86EFAC" font-size="18" font-weight="700">Approved</text>

    <path d="M650 1860 C796 1860 856 1758 856 1608 C856 1496 810 1458 754 1488" fill="none" stroke="#CBD5E1" stroke-width="2.3" marker-end="url(#arrow)"/>
    <text x="918" y="1672" text-anchor="middle" fill="#A5B4FC" font-size="18" font-weight="700">Revise</text>
  </g>
</svg>
