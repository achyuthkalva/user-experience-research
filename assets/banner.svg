<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460" role="img" aria-labelledby="title desc">
  <title id="title">UX Research — OMSEP + Prism</title>
  <desc id="desc">A portable UX Research skill for planning, synthesis, and decision-ready reporting.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.54" stop-color="#151B35"/>
      <stop offset="1" stop-color="#222A4A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="55"/></filter>
  </defs>

  <rect width="1400" height="460" rx="28" fill="url(#bg)"/>
  <circle cx="1180" cy="72" r="150" fill="#8B5CF6" opacity="0.16" filter="url(#blur)"/>
  <circle cx="1240" cy="360" r="170" fill="#22C55E" opacity="0.10" filter="url(#blur)"/>
  <circle cx="205" cy="420" r="150" fill="#38BDF8" opacity="0.09" filter="url(#blur)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="72" y="104" fill="#A5B4FC" font-size="21" font-weight="700" letter-spacing="2.1">PORTABLE AI SKILL · UX RESEARCH</text>
    <text x="72" y="184" fill="#FFFFFF" font-size="64" font-weight="800">UX Research</text>
    <text x="72" y="239" fill="#CBD5E1" font-size="25" font-weight="500">OMSEP planning + Prism evidence-to-decision synthesis</text>
    <rect x="72" y="273" width="560" height="6" rx="3" fill="url(#accent)"/>
    <text x="72" y="330" fill="#94A3B8" font-size="22" font-weight="500">Plan defensibly. Trace evidence. Keep judgement human.</text>

    <g>
      <rect x="780" y="54" width="550" height="352" rx="26" fill="#FFFFFF" opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.12"/>

      <g font-size="17" font-weight="700">
        <circle cx="834" cy="112" r="20" fill="#8B5CF6"/><text x="834" y="118" text-anchor="middle" fill="#FFFFFF" font-size="15">O</text><text x="870" y="118" fill="#E2E8F0">Objective</text>
        <circle cx="834" cy="171" r="20" fill="#7C3AED"/><text x="834" y="177" text-anchor="middle" fill="#FFFFFF" font-size="15">M</text><text x="870" y="177" fill="#E2E8F0">Methodology</text>
        <circle cx="834" cy="230" r="20" fill="#6366F1"/><text x="834" y="236" text-anchor="middle" fill="#FFFFFF" font-size="15">S</text><text x="870" y="236" fill="#E2E8F0">Scope</text>
        <circle cx="834" cy="289" r="20" fill="#0EA5E9"/><text x="834" y="295" text-anchor="middle" fill="#FFFFFF" font-size="15">E</text><text x="870" y="295" fill="#E2E8F0">Essentials</text>
        <circle cx="834" cy="348" r="20" fill="#14B8A6"/><text x="834" y="354" text-anchor="middle" fill="#FFFFFF" font-size="15">P</text><text x="870" y="354" fill="#E2E8F0">Protocol</text>
      </g>

      <g stroke="#72819E" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 9" opacity="0.95">
        <path d="M1048 112 H1120"/>
        <path d="M1048 171 H1120"/>
        <path d="M1048 230 H1120"/>
        <path d="M1048 289 H1120"/>
        <path d="M1048 348 H1120"/>
      </g>

      <g>
        <rect x="1142" y="90" width="144" height="280" rx="22" fill="#FFFFFF" opacity="0.075" stroke="#FFFFFF" stroke-opacity="0.11"/>
        <text x="1214" y="133" text-anchor="middle" fill="#7DD3FC" font-size="16" font-weight="800" letter-spacing="0.4">PRISM</text>
        <path d="M1214 186 V267" stroke="#93A4C0" stroke-width="2.5" opacity="0.85"/>
        <circle cx="1214" cy="186" r="10" fill="#38BDF8"/>
        <circle cx="1214" cy="226" r="10" fill="#2DD4BF"/>
        <circle cx="1214" cy="266" r="10" fill="#22C55E"/>
        <text x="1214" y="333" text-anchor="middle" fill="#CBD5E1" font-size="12.5" font-weight="500">Evidence → Action</text>
      </g>
    </g>
  </g>
